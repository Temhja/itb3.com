<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اطبع.com | ITB3 — اطبع وانت بمكانك</title>

<meta property="og:title" content="اطبع.com | ITB3 — اطبع وانت بمكانك">

<body class="font-arabic">

<nav id="main-nav"></nav>

<main>

<!-- Hero Slider -->
<section class="hero-slider">
  <div class="slides-track">
    <div class="slide slide-1">
      <div class="container"><div class="slide-content">
        <div class="slide-eyebrow"><span data-i18n="hero1_tag"></span></div>
        <h2><bdi data-i18n="hero1_a"></bdi><br><span data-i18n="hero1_b"></span></h2>
        <p data-i18n="hero1_p"></p>
        <a href="products/index.html" class="slide-cta" data-i18n="browse"></a>
      </div>
      <div class="slide-media slide-media--3" aria-hidden="true"><img src="assets/images/products/flyer.webp" alt="" width="1000" height="747"><img src="assets/images/products/advertising-bag.webp" alt="" width="1000" height="747"><img src="assets/images/products/soft-touch-business-card.webp" alt="" width="1000" height="747"></div>
      </div>
    </div>
    <div class="slide slide-2">
      <div class="container"><div class="slide-content">
        <div class="slide-eyebrow"><span data-i18n="hero_offer"></span></div>
        <h2><bdi data-i18n="hero2_a"></bdi><br><span data-i18n="hero2_b"></span></h2>
        <p data-i18n="hero2_p"></p>
        <a href="product.html?id=standard-business-card" class="slide-cta" data-i18n="shop_now"></a>
      </div>
      <div class="slide-media slide-media--2" aria-hidden="true"><img src="assets/images/products/foil-business-card.webp" alt="" width="1000" height="747" loading="lazy"><img src="assets/images/products/standard-business-card.webp" alt="" width="1000" height="747" loading="lazy"></div>
      </div>
    </div>
    <div class="slide slide-3">
      <div class="container"><div class="slide-content">
        <div class="slide-eyebrow"><span data-i18n="hero3_tag"></span></div>
        <h2><bdi data-i18n="hero3_a"></bdi><br><span data-i18n="hero3_b"></span></h2>
        <p data-i18n="hero3_p"></p>
        <a href="product.html?id=menu" class="slide-cta" data-i18n="shop_now"></a>
      </div>
      <div class="slide-media slide-media--1" aria-hidden="true"><img src="assets/images/products/menu.webp" alt="" width="1000" height="747" loading="lazy"></div>
      </div>
    </div>
  </div>
  <button class="slider-arrow slider-prev" aria-label="previous">‹</button>
  <button class="slider-arrow slider-next" aria-label="next">›</button>
  <div class="slider-dots"><div class="slider-dot active"></div><div class="slider-dot"></div><div class="slider-dot"></div></div>
</section>

<!-- Categories -->
<section class="sec" style="background:var(--bg-gray);border-bottom:1px solid var(--border)">
  <div class="container">
    <div class="sec-header">
      <h2 class="sec-title"><span data-i18n="cats_title"></span></h2>
      <a href="products/index.html" class="sec-link" data-i18n="view_all"></a>
    </div>
    <div class="cats-grid" id="cats-grid">
      <div style="grid-column:1/-1;text-align:center;padding:32px;color:var(--text-muted)" data-i18n="loading"></div>
    </div>
  </div>
</section>

<!-- Featured Products -->
<section class="sec">
  <div class="container">
    <div class="sec-header">
      <h2 class="sec-title"><span data-i18n="feat_title"></span></h2>
      <a href="products/index.html" class="sec-link" data-i18n="view_all"></a>
    </div>
    <div class="products-grid" id="featured-grid">
      <div style="grid-column:1/-1;text-align:center;padding:32px;color:var(--text-muted)" data-i18n="loading"></div>
    </div>
  </div>
</section>

<!-- Why Us -->
<section class="sec" style="background:var(--secondary)">
  <div class="container">
    <h2 style="font-size:1.6rem;font-weight:700;color:#fff;text-align:center;margin-bottom:36px" data-i18n="why_title"></h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px">
      <div class="why-card"><i class="i i-coin"></i><h3 data-i18n="why1_t"></h3><p data-i18n="why1_p"></p></div>
      <div class="why-card"><i class="i i-bolt"></i><h3 data-i18n="why2_t"></h3><p data-i18n="why2_p"></p></div>
      <div class="why-card"><i class="i i-tag"></i><h3 data-i18n="why3_t"></h3><p data-i18n="why3_p"></p></div>
      <div class="why-card"><i class="i i-chat"></i><h3 data-i18n="why4_t"></h3><p data-i18n="why4_p"></p></div>
    </div>
  </div>
</section>

</main>


<script src="assets/js/i18n.js?v=b096e716"></script>
<script src="assets/js/price-calc.js?v=cfbca00f"></script>
<script src="assets/js/cart.js?v=b23bc82e"></script>
<script src="assets/js/auth.js?v=bb1042af"></script>
<script src="assets/js/app.js?v=ef0a6fc9"></script>
<script>
async function pageRender() {
  const lang = i18n.getLang();
  const data = await loadData();

  // Categories grid
  const cg = document.getElementById('cats-grid');
  if(cg) cg.innerHTML = data.categories.map(c => buildCatCard(c)).join('');

  // Featured products
  const fg = document.getElementById('featured-grid');
  if(fg) {
    const feat = data.products.filter(p => p.featured);
    fg.innerHTML = feat.map(p => buildCard(p)).join('');
    i18n.render();
  }
  document.querySelectorAll('.fade-up').forEach(el => setTimeout(()=>el.classList.add('in'),50));
}
document.addEventListener('DOMContentLoaded', pageRender);
</script>
</body>
</html>
